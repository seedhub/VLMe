name: Build VLMe debug APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;21.4.7075529" "cmake;3.22.1" "platform-tools"
          yes | sdkmanager --licenses || true

      # Mirrors upstream continuous-app-build: clones libvlcjni + VLC sources
      # and generates the gradle wrapper (repo ships no gradlew).
      - name: Init build environment
        env:
          ANDROID_SDK: ${{ env.ANDROID_HOME }}
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/21.4.7075529
        run: |
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          ./buildsystem/compile.sh --init

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VLMe-debug-apk
          path: application/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
