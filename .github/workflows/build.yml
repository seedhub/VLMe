name: Build VLMe debug APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # GitHub-hosted ubuntu runners already ship a full Android SDK
      # (ANDROID_HOME=/usr/local/lib/android/sdk with cmdline-tools).
      # The android-actions/setup-android@v3 step failed on the first
      # run, so use the preinstalled SDK's sdkmanager directly instead.
      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;21.4.7075529" "cmake;3.22.1" "platform-tools"

      # Mirrors upstream continuous-app-build: clones libvlcjni + VLC sources
      # and generates the gradle wrapper (repo ships no gradlew).
      # compile.sh applies custom patches to the cloned VLC sources with
      # git, which fails on a fresh runner with no committer identity.
      - name: Set git identity
        run: |
          git config --global user.name "VLMe CI"
          git config --global user.email "vlme-ci@users.noreply.github.com"

      - name: Init build environment
        run: |
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          export ANDROID_SDK="$ANDROID_HOME"
          export ANDROID_NDK="$ANDROID_HOME/ndk/21.4.7075529"
          ./buildsystem/compile.sh --init

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VLMe-debug-apk
          path: application/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
